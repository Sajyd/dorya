<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <g filter="url(#glow)">
    <!-- Electric Wind God Fist Lightning Bolt -->
    <path d="M320 64 L176 240 L240 240 L192 448 L336 224 L272 224 Z" fill="url(#lightning)"/>
    <!-- Electric arcs -->
    <path d="M160 180 Q140 200 160 220" stroke="#FACC15" stroke-width="8" fill="none" opacity="0.8"/>
    <path d="M352 260 Q372 280 352 300" stroke="#FACC15" stroke-width="8" fill="none" opacity="0.8"/>
    <circle cx="144" cy="200" r="6" fill="#FACC15" opacity="0.9"/>
    <circle cx="368" cy="280" r="6" fill="#FACC15" opacity="0.9"/>
  </g>
</svg>

